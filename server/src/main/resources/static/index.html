<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CNC 服务端管理后台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login">
    <div class="login-card">
      <h1>CNC 服务端管理后台</h1>
      <p>配置刀具、材料、工艺、图纸与设备通讯参数。平板客户端联网后自动拉取，离线时使用上次缓存。</p>
      <label for="username">账号</label>
      <input id="username" type="text" placeholder="默认 admin" autocomplete="username" />
      <label for="password" style="margin-top:10px">密码</label>
      <input id="password" type="password" placeholder="默认 123456" autocomplete="current-password" />
      <div class="row">
        <button class="primary" id="login-btn" style="flex:1">登录</button>
      </div>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div id="app">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">CN</div>
          <div><b>CNC 服务端</b><span>配置与监控</span></div>
        </div>
        <div id="nav"></div>
        <div style="margin-top:18px; padding:0 8px;">
          <div class="desc" style="margin-bottom:8px">当前账号：<b id="current-user">-</b></div>
          <button class="small" id="change-pwd-btn" style="width:100%; margin-bottom:6px">修改密码</button>
          <button class="small" id="logout-btn" style="width:100%">退出登录</button>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <h2 id="page-title">概览</h2>
            <div class="sub" id="page-sub">配置版本与设备实时状态</div>
          </div>
          <div class="top-actions">
            <span class="badge"><span class="dot" id="ws-dot"></span><span id="ws-text">状态流未连接</span></span>
            <span class="badge">配置版本 v<span id="cfg-version">-</span></span>
            <button class="small" id="refresh-btn">刷新</button>
            <button class="small danger" id="logout-btn2">登出</button>
          </div>
        </div>
        <div id="content"></div>
      </main>
    </div>
  </div>

  <div id="modal-mask">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title">编辑</h3>
        <button class="close-x" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot">
        <button id="modal-cancel">取消</button>
        <button class="primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
